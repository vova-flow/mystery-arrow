<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mischief Managed — Birthday Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f0c18;
      --bg-card: #1a1528;
      --gold: #e5b84b;
      --gold-light: #fff0b3;
      --gold-dim: #8c6d23;
      --parchment: #f4e8d1;
      --accent-glow: rgba(229, 184, 75, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(circle at top, #1f1933 0%, var(--bg-dark) 75%);
      color: var(--parchment);
      font-family: 'Crimson Text', Georgia, serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 18px 32px;
      text-align: center;
      overflow: hidden;
      perspective: 900px;
      user-select: none;
    }

    header h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.55rem;
      letter-spacing: 0.08em;
      color: var(--gold);
      text-shadow: 0 0 18px var(--accent-glow);
      margin-bottom: 6px;
    }

    header p {
      font-size: 1.1rem;
      font-style: italic;
      color: #d3c5aa;
      max-width: 320px;
      margin: 0 auto;
    }

    /* 3D Compass Container with playful floating/wiggling animation */
    .compass-wrapper {
      position: relative;
      width: 295px;
      height: 295px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 12px 0;
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out;
      animation: floatAndWiggle 4s ease-in-out infinite;
    }

    @keyframes floatAndWiggle {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-8px) rotate(1.5deg);
      }
    }

    /* Chunky Cartoon Arrow Container with Deep Shadow */
    .arrow-container {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease-out;
      transform-style: preserve-3d;
      filter: drop-shadow(0 16px 20px rgba(0, 0, 0, 0.75));
    }

    .arrow-svg {
      width: 230px;
      height: 230px;
      transform: translateZ(35px); /* Pops out in 3D when phone tilts */
    }

    /* Status & Distance Readout Card */
    .readout-box {
      background: rgba(26, 21, 40, 0.85);
      border: 1px solid var(--gold-dim);
      border-radius: 14px;
      padding: 14px 22px;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    .distance-label {
      font-family: 'Cinzel', serif;
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #b5a584;
    }

    .distance-value {
      font-family: 'Cinzel', serif;
      font-size: 1.95rem;
      font-weight: 800;
      color: var(--gold-light);
      margin: 4px 0;
    }

    .status-text {
      font-size: 0.98rem;
      color: #cbbba0;
      min-height: 1.4em;
    }

    .arrived-banner {
      display: none;
      margin-top: 8px;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgba(229, 184, 75, 0.18);
      border: 1px solid var(--gold);
      color: var(--gold-light);
      font-family: 'Cinzel', serif;
      font-size: 0.9rem;
    }

    /* Activation Button */
    button#startBtn {
      background: linear-gradient(135deg, #d4a02c 0%, #f5d06b 50%, #c6901e 100%);
      color: #161024;
      border: none;
      border-radius: 999px;
      padding: 14px 28px;
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      cursor: pointer;
      box-shadow: 0 0 22px var(--accent-glow);
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    button#startBtn:active {
      transform: scale(0.96);
    }

    button#startBtn.hidden {
      display: none;
    }

    .hint {
      font-size: 0.85rem;
      color: #8f826c;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Happy Birthday, My Love</h1>
    <p>"I solemnly swear that I am up to no good." Follow the wand to your surprise.</p>
  </header>

  <div class="compass-wrapper" id="compassWrapper">
    <!-- Solid, Bulky Cartoon Arrow pointing UP -->
    <div class="arrow-container" id="arrowContainer">
      <svg class="arrow-svg" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="goldGradient" x1="60" y1="10" x2="60" y2="110" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFF5C0"/>
            <stop offset="45%" stop-color="#E5B84B"/>
            <stop offset="100%" stop-color="#A67C1E"/>
          </linearGradient>
        </defs>

        <!-- Chunky, Bulky Cartoon Arrow Body with Dark Outline -->
        <path
          d="M 60 10
             L 98 50
             Q 102 55 94 55
             L 74 55
             L 74 104
             Q 74 110 68 110
             L 52 110
             Q 46 110 46 104
             L 46 55
             L 26 55
             Q 18 55 22 50
             Z"
          fill="url(#goldGradient)"
          stroke="#382607"
          stroke-width="5"
          stroke-linejoin="round"
        />

        <!-- Glossy Highlight Streak -->
        <path
          d="M 55 22 L 35 46"
          stroke="#FFFFFF"
          stroke-width="4"
          stroke-linecap="round"
          opacity="0.75"
        />
        <line
          x1="53" y1="62" x2="53" y2="98"
          stroke="#FFFFFF"
          stroke-width="4"
          stroke-linecap="round"
          opacity="0.6"
        />

        <!-- Center Magical Gem / Rivet -->
        <circle cx="60" cy="58" r="8" fill="#1A1528" stroke="#E5B84B" stroke-width="3"/>
        <circle cx="58" cy="56" r="2.5" fill="#FFF5C0"/>
      </svg>
    </div>
  </div>

  <div class="readout-box">
    <div class="distance-label">Distance to Destination</div>
    <div class="distance-value" id="distanceDisplay">—</div>
    <div class="status-text" id="statusText">Tap below to awaken the compass</div>
    <div class="arrived-banner" id="arrivedBanner">✨ You have arrived at the destination! ✨</div>
  </div>

  <div>
    <button id="startBtn">Cast Point Me</button>
    <div class="hint" id="hintText">Tilt your phone to test the 3D perspective response</div>
  </div>

  <script>
    // Hardcoded coordinates for Harry Potter Shop Chicago (676 N Michigan Ave, Chicago, IL)
    const TARGET_LAT = 41.8947435;
    const TARGET_LON = -87.6249238;

    let currentLat = null;
    let currentLon = null;
    let phoneHeading = 0;
    let targetBearing = null;

    let tiltX = 0;
    let tiltY = 0;

    const startBtn = document.getElementById('startBtn');
    const statusText = document.getElementById('statusText');
    const distanceDisplay = document.getElementById('distanceDisplay');
    const arrowContainer = document.getElementById('arrowContainer');
    const compassWrapper = document.getElementById('compassWrapper');
    const arrivedBanner = document.getElementById('arrivedBanner');
    const hintText = document.getElementById('hintText');

    const toRad = (deg) => (deg * Math.PI) / 180;
    const toDeg = (rad) => (rad * 180) / Math.PI;

    function calculateDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function calculateBearing(lat1, lon1, lat2, lon2) {
      const phi1 = toRad(lat1);
      const phi2 = toRad(lat2);
      const dLambda = toRad(lon2 - lon1);

      const y = Math.sin(dLambda) * Math.cos(phi2);
      const x =
        Math.cos(phi1) * Math.sin(phi2) -
        Math.sin(phi1) * Math.cos(phi2) * Math.cos(dLambda);

      const theta = Math.atan2(y, x);
      return (toDeg(theta) + 360) % 360;
    }

    function formatDistance(meters) {
      const feet = meters * 3.28084;
      if (feet < 1000) {
        return `${Math.round(feet)} ft`;
      }
      const miles = meters / 1609.344;
      return `${miles.toFixed(2)} mi`;
    }

    function updateUI() {
      const clampedX = Math.max(-35, Math.min(35, tiltX));
      const clampedY = Math.max(-35, Math.min(35, tiltY));
      compassWrapper.style.transform = `rotateX(${-clampedX}deg) rotateY(${clampedY}deg)`;

      if (currentLat === null || currentLon === null) {
        return;
      }

      const distMeters = calculateDistanceMeters(currentLat, currentLon, TARGET_LAT, TARGET_LON);
      targetBearing = calculateBearing(currentLat, currentLon, TARGET_LAT, TARGET_LON);

      distanceDisplay.textContent = formatDistance(distMeters);

      const arrowRotation = (targetBearing - phoneHeading + 360) % 360;
      arrowContainer.style.transform = `rotate(${arrowRotation}deg)`;

      if (distMeters <= 35) {
        arrivedBanner.style.display = 'block';
        statusText.textContent = 'Look up — the magic awaits!';
      } else {
        arrivedBanner.style.display = 'none';
        statusText.textContent = `Heading ${Math.round(targetBearing)}° • Keep following the golden arrow`;
      }
    }

    function handleOrientation(event) {
      let heading = null;

      if (typeof event.webkitCompassHeading === 'number') {
        heading = event.webkitCompassHeading;
      } else if (event.alpha !== null) {
        heading = (360 - event.alpha) % 360;
      }

      if (heading !== null && !Number.isNaN(heading)) {
        const screenAngle = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
        phoneHeading = (heading + screenAngle + 360) % 360;
      }

      if (event.beta !== null && event.gamma !== null) {
        tiltX = event.beta;
        tiltY = event.gamma;
      }

      updateUI();
    }

    function startTracking() {
      if (!('geolocation' in navigator)) {
        statusText.textContent = 'Geolocation is not supported.';
        return;
      }

      statusText.textContent = 'Acquiring GPS signal...';

      navigator.geolocation.watchPosition(
        (pos) => {
          currentLat = pos.coords.latitude;
          currentLon = pos.coords.longitude;
          updateUI();
        },
        (err) => {
          statusText.textContent = `Location error: ${err.message}.`;
        },
        {
          enableHighAccuracy: true,
          maximumAge: 1000,
          timeout: 15000
        }
      );

      if ('ondeviceorientationabsolute' in window) {
        window.addEventListener('deviceorientationabsolute', handleOrientation, true);
      } else {
        window.addEventListener('deviceorientation', handleOrientation, true);
      }
    }

    startBtn.addEventListener('click', async () => {
      if (
        typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function'
      ) {
        try {
          const response = await DeviceOrientationEvent.requestPermission();
          if (response !== 'granted') {
            statusText.textContent = 'Compass permission denied.';
            return;
          }
        } catch (err) {
          statusText.textContent = 'Could not request permission.';
          return;
        }
      }

      startBtn.classList.add('hidden');
      hintText.textContent = 'Tilt your phone to test the 3D perspective response';
      startTracking();
    });
  </script>
</body>
</html>
