<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mystery Destination</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: rgba(30, 41, 59, 0.85);
      --border-color: rgba(148, 163, 184, 0.25);
      --accent-blue: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      font-family: 'Fredoka', system-ui, -apple-system, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 18px 32px;
      text-align: center;
      overflow: hidden;
      perspective: 900px;
      user-select: none;
    }

    header h1 {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    header p {
      font-size: 1rem;
      color: var(--text-muted);
      max-width: 310px;
      margin: 0 auto;
    }

    /* 3D Arrow Container with playful cartoon float/wiggle animation */
    .compass-wrapper {
      position: relative;
      width: 295px;
      height: 295px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 8px 0;
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out;
      animation: floatAndWiggle 4s ease-in-out infinite;
    }

    @keyframes floatAndWiggle {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-8px) rotate(1.5deg);
      }
    }

    /* Big Extruded 3D Arrow Container */
    .arrow-container {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease-out;
      transform-style: preserve-3d;
      filter: drop-shadow(0 20px 25px rgba(2, 132, 199, 0.35));
    }

    .arrow-svg {
      width: 250px;
      height: 250px;
      transform: translateZ(35px);
    }

    /* Status & Distance Readout Card */
    .readout-box {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid var(--border-color);
      border-radius: 20px;
      padding: 16px 20px;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .distance-label {
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
    }

    .distance-value {
      font-size: 2.25rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 2px 0;
    }

    .status-text {
      font-size: 0.95rem;
      color: var(--text-muted);
      min-height: 1.3em;
    }

    .arrived-banner {
      display: none;
      margin-top: 8px;
      padding: 8px 12px;
      border-radius: 12px;
      background: rgba(56, 189, 248, 0.18);
      border: 2px solid var(--accent-blue);
      color: var(--accent-blue);
      font-weight: 700;
      font-size: 0.95rem;
    }

    /* Activation Button */
    button#startBtn {
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
      color: #0f172a;
      border: 3px solid #0f172a;
      border-radius: 999px;
      padding: 14px 32px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 0 #0f172a, 0 10px 25px rgba(56, 189, 248, 0.4);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    button#startBtn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #0f172a;
    }

    button#startBtn.hidden {
      display: none;
    }

    .hint {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Mystery Destination</h1>
    <p>Follow the 3D arrow to find your surprise!</p>
  </header>

  <div class="compass-wrapper" id="compassWrapper">
    <!-- Smooth Extruded 3D Arrow styled like reference image -->
    <div class="arrow-container" id="arrowContainer">
      <svg class="arrow-svg" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- 3D Extrusion Side/Depth Gradient (Darker Shade) -->
          <linearGradient id="sideDepth" x1="50" y1="35" x2="110" y2="110" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0284c7"/>
            <stop offset="100%" stop-color="#0369a1"/>
          </linearGradient>
          <!-- Main Top Face Gradient (Bright Smooth Blue) -->
          <linearGradient id="topFace" x1="70" y1="20" x2="70" y2="120" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#7dd3fc"/>
            <stop offset="100%" stop-color="#38bdf8"/>
          </linearGradient>
        </defs>

        <!-- Extruded 3D Depth Shadow/Sides (Offset down-right) -->
        <g fill="url(#sideDepth)">
          <!-- Shaft depth -->
          <rect x="32" y="62" width="50" height="42" rx="10" />
          <!-- Head depth -->
          <path d="M 68 28 L 118 78 L 82 78 Z" />
        </g>

        <!-- Main Smooth Top Face -->
        <g fill="url(#topFace)">
          <!-- Shaft Top -->
          <rect x="28" y="56" width="50" height="42" rx="10" />
          <!-- Head Top -->
          <path d="M 64 22 L 114 72 L 78 72 Z" />
          <!-- Center connecting square to make it one solid shape -->
          <rect x="64" y="56" width="18" height="20" />
        </g>

        <!-- Soft Highlight Reflection for Glossy 3D Look -->
        <path d="M 34 64 L 68 64" stroke="#bae6fd" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
        <path d="M 72 36 L 98 62" stroke="#bae6fd" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
      </svg>
    </div>
  </div>

  <div class="readout-box">
    <div class="distance-label">Distance Remaining</div>
    <div class="distance-value" id="distanceDisplay">—</div>
    <div class="status-text" id="statusText">Tap below to start tracking</div>
    <div class="arrived-banner" id="arrivedBanner">🎉 You Made It! 🎉</div>
  </div>

  <div>
    <button id="startBtn">Let's Go!</button>
    <div class="hint" id="hintText">Tilt your phone to rotate the 3D arrow</div>
  </div>

  <script>
    // Hardcoded coordinates for Harry Potter Shop Chicago (676 N Michigan Ave, Chicago, IL)
    const TARGET_LAT = 41.8947435;
    const TARGET_LON = -87.6249238;

    let currentLat = null;
    let currentLon = null;
    let phoneHeading = 0;
    let targetBearing = null;

    let tiltX = 0;
    let tiltY = 0;

    const startBtn = document.getElementById('startBtn');
    const statusText = document.getElementById('statusText');
    const distanceDisplay = document.getElementById('distanceDisplay');
    const arrowContainer = document.getElementById('arrowContainer');
    const compassWrapper = document.getElementById('compassWrapper');
    const arrivedBanner = document.getElementById('arrivedBanner');
    const hintText = document.getElementById('hintText');

    const toRad = (deg) => (deg * Math.PI) / 180;
    const toDeg = (rad) => (rad * 180) / Math.PI;

    function calculateDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function calculateBearing(lat1, lon1, lat2, lon2) {
      const phi1 = toRad(lat1);
      const phi2 = toRad(lat2);
      const dLambda = toRad(lon2 - lon1);

      const y = Math.sin(dLambda) * Math.cos(phi2);
      const x =
        Math.cos(phi1) * Math.sin(phi2) -
        Math.sin(phi1) * Math.cos(phi2) * Math.cos(dLambda);

      const theta = Math.atan2(y, x);
      return (toDeg(theta) + 360) % 360;
    }

    function formatDistance(meters) {
      const feet = meters * 3.28084;
      if (feet < 1000) {
        return `${Math.round(feet)} ft`;
      }
      const miles = meters / 1609.344;
      return `${miles.toFixed(2)} mi`;
    }

    function updateUI() {
      const clampedX = Math.max(-35, Math.min(35, tiltX));
      const clampedY = Math.max(-35, Math.min(35, tiltY));
      compassWrapper.style.transform = `rotateX(${-clampedX}deg) rotateY(${clampedY}deg)`;

      if (currentLat === null || currentLon === null) {
        return;
      }

      const distMeters = calculateDistanceMeters(currentLat, currentLon, TARGET_LAT, TARGET_LON);
      targetBearing = calculateBearing(currentLat, currentLon, TARGET_LAT, TARGET_LON);

      distanceDisplay.textContent = formatDistance(distMeters);

      // Point directly toward destination relative to phone's compass heading
      const arrowRotation = (targetBearing - phoneHeading + 360) % 360;
      arrowContainer.style.transform = `rotate(${arrowRotation}deg)`;

      if (distMeters <= 35) {
        arrivedBanner.style.display = 'block';
        statusText.textContent = 'Look around — your surprise is right here!';
      } else {
        arrivedBanner.style.display = 'none';
        statusText.textContent = `Heading ${Math.round(targetBearing)}° • Keep following the arrow`;
      }
    }

    function handleOrientation(event) {
      let heading = null;

      if (typeof event.webkitCompassHeading === 'number') {
        heading = event.webkitCompassHeading;
      } else if (event.alpha !== null) {
        heading = (360 - event.alpha) % 360;
      }

      if (heading !== null && !Number.isNaN(heading)) {
        const screenAngle = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
        phoneHeading = (heading + screenAngle + 360) % 360;
      }

      if (event.beta !== null && event.gamma !== null) {
        tiltX = event.beta;
        tiltY = event.gamma;
      }

      updateUI();
    }

    function startTracking() {
      if (!('geolocation' in navigator)) {
        statusText.textContent = 'Geolocation is not supported.';
        return;
      }

      statusText.textContent = 'Finding your location...';

      navigator.geolocation.watchPosition(
        (pos) => {
          currentLat = pos.coords.latitude;
          currentLon = pos.coords.longitude;
          updateUI();
        },
        (err) => {
          statusText.textContent = `Location error: ${err.message}.`;
        },
        {
          enableHighAccuracy: true,
          maximumAge: 1000,
          timeout: 15000
        }
      );

      if ('ondeviceorientationabsolute' in window) {
        window.addEventListener('deviceorientationabsolute', handleOrientation, true);
      } else {
        window.addEventListener('deviceorientation', handleOrientation, true);
      }
    }

    startBtn.addEventListener('click', async () => {
      if (
        typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function'
      ) {
        try {
          const response = await DeviceOrientationEvent.requestPermission();
          if (response !== 'granted') {
            statusText.textContent = 'Motion sensor permission denied.';
            return;
          }
        } catch (err) {
          statusText.textContent = 'Could not request sensor permission.';
          return;
        }
      }

      startBtn.classList.add('hidden');
      hintText.textContent = 'Tilt your phone to interact with the 3D arrow';
      startTracking();
    });
  </script>
</body>
</html>
